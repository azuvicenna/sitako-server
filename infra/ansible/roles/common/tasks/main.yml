---
# =============================================================================
# Role: common
# Task: Konfigurasi sistem dasar, keamanan, firewall, dan dependensi
# =============================================================================

- name: Update cache apt repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install paket-paket sistem esensial
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - git
      - htop
      - ufw
      - fail2ban
      - unzip
      - rsync
    state: present

# -----------------------------------------------------------------------------
# Konfigurasi Swap Memory (Mencegah OOM pada server dengan RAM terbatas)
# -----------------------------------------------------------------------------
- name: Cek ketersediaan file swap
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_stat

- name: Buat file swap jika belum ada
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M /swapfile"
  when: not swap_file_stat.stat.exists and (swap_size_mb | int > 0)
  changed_when: true

- name: Atur hak akses permission swap file
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when: not swap_file_stat.stat.exists and (swap_size_mb | int > 0)

- name: Format file swap sebagai swap space
  ansible.builtin.command:
    cmd: "mkswap /swapfile"
  when: not swap_file_stat.stat.exists and (swap_size_mb | int > 0)
  changed_when: true

- name: Aktifkan file swap
  ansible.builtin.command:
    cmd: "swapon /swapfile"
  when: not swap_file_stat.stat.exists and (swap_size_mb | int > 0)
  changed_when: true

- name: Daftarkan file swap ke /etc/fstab agar persisten saat reboot
  ansible.posix.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present
  when: swap_size_mb | int > 0

# -----------------------------------------------------------------------------
# Keamanan & Firewall (UFW)
# -----------------------------------------------------------------------------
- name: Atur kebijakan default UFW (Deny Incoming, Allow Outgoing)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Izinkan port yang dibutuhkan pada firewall UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_ports }}"

- name: Aktifkan layanan UFW firewall
  community.general.ufw:
    state: enabled

# -----------------------------------------------------------------------------
# Fail2ban
# -----------------------------------------------------------------------------
- name: Pastikan layanan fail2ban berjalan dan aktif saat booting
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
