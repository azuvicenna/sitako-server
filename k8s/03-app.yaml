apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitako-app
  namespace: sitako
  labels:
    app: sitako-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sitako-app
  template:
    metadata:
      labels:
        app: sitako-app
    spec:
      containers:
        - name: backend
          image: sitako-backend:latest
          imagePullPolicy: IfNotPresent # Cocok untuk image lokal yang di-load ke k3s via 'k3s ctr images import'
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sitako-config
            - secretRef:
                name: sitako-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: sitako
  labels:
    app: sitako-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: sitako-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitako-ingress
  namespace: sitako
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik # Traefik adalah default ingress controller di K3s
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
