name: sitako-backend
# -----------------------------------------------------------------------------
# SITAKO Backend - Production Compose with Nginx Load Balancer
# 
# Jalankan dengan:
#   docker compose -f docker-compose.prod.yml up -d --scale app=2
# -----------------------------------------------------------------------------

services:
  # Service App (Backend Node.js)
  # Tanpa container_name & port mapping host agar siap di-scale multi-replica
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-SITAKO-backend}
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
    env_file:
      - .env
    volumes:
      - app-storage:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Service Load Balancer (Nginx Reverse Proxy)
  # Menerima trafik publik di port 80 (atau LB_PORT) dan membaginya ke seluruh replika app
  loadbalancer:
    image: nginx:alpine
    container_name: sitako-loadbalancer
    restart: unless-stopped
    ports:
      - "${LB_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  database:
    image: postgres:18-alpine
    container_name: sitako-db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:trixie
    container_name: sitako-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  # --- Monitoring stack ---

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: sitako-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-mydb}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: sitako-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      - redis
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: sitako-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9091"
    ports:
      - "${PROMETHEUS_PORT:-9091}:9091"
    depends_on:
      - app
      - postgres_exporter
      - redis_exporter
    networks:
      - backend

networks:
  backend:
    name: sitako-network
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  prometheus-data:
    driver: local
