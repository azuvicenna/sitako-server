name: sitako-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    # ⬇️ [JIKA PAKAI LOAD BALANCER: COMMENT BARIS INI]
    # Agar Docker bisa membuat nama kontainer unik untuk tiap replika (--scale app=2)
    container_name: sitako-app
    restart: unless-stopped
    # ⬇️ [JIKA PAKAI LOAD BALANCER: COMMENT 2 BARIS PORTS INI]
    # Agar tidak bentrok port di host. Port publik akan dipegang oleh service loadbalancer (Nginx)
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - APP_NAME=${APP_NAME:-SITAKO-backend}
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
    env_file:
      - .env
    volumes:
      - app-storage:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: postgres:18-alpine
    container_name: sitako-db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:trixie
    container_name: sitako-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  # --- Monitoring stack ---

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: sitako-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-mydb}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: sitako-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      - redis
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: sitako-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9091"
    ports:
      - "${PROMETHEUS_PORT:-9091}:9091"
    depends_on:
      - app
      - postgres_exporter
      - redis_exporter
    networks:
      - backend

  # --- Load Balancer (Nginx) ---
  # Aktifkan service ini jika Anda ingin menjalankan multi-replica app (misal: docker compose up -d --scale app=2).
  # Catatan langkah saat mengaktifkan:
  # 1. Hapus/comment baris 'container_name: sitako-app' pada service 'app' di atas agar Docker bisa men-generate nama kontainer unik untuk tiap replika.
  # 2. Hapus/comment baris ports host mapping '- "${PORT:-8080}:${PORT:-8080}"' pada service 'app' agar tidak terjadi port collision di host.
  # 3. Port akses publik diarahkan melalui load balancer ini (misal port 80 atau 8080).
  #
  # loadbalancer:
  #   image: nginx:alpine
  #   container_name: sitako-loadbalancer
  #   restart: unless-stopped
  #   ports:
  #     - "${LB_PORT:-80}:80"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - backend
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  prometheus-data:
    driver: local
